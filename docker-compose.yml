services:
  app:
    build: .
    environment:
      PORT: 5191
      HOST: 0.0.0.0
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ports: ["5191:5191"]
    depends_on: [postgres, redis, minio]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: puzzle
      POSTGRES_PASSWORD: puzzle
      POSTGRES_DB: puzzle_platform
    ports: ["5432:5432"]
    volumes: ["puzzle_postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000", "9001:9001"]
    volumes: ["puzzle_minio:/data"]
volumes:
  puzzle_postgres:
  puzzle_minio:
